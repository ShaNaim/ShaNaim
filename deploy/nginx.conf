# Reference nginx config for shanaimshourov.com.
# Copy this to /etc/nginx/sites-available/shanaimshourov.com on the server,
# then symlink it into sites-enabled (see deploy/SETUP.md for the full walkthrough).

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name shanaimshourov.com www.shanaimshourov.com;

    return 301 https://shanaimshourov.com$request_uri;
}

server {
    # Ubuntu 22.04's default `apt install nginx` ships 1.18, which predates
    # the standalone `http2 on;` directive (added in 1.25.1) — use the
    # older `listen ... http2;` form, which works on both old and new nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shanaimshourov.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    return 301 https://shanaimshourov.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shanaimshourov.com;

    root /var/www/shanaimshourov.com;
    index index.html;

    # Cloudflare Origin Certificate — see deploy/SETUP.md for how to generate it.
    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    # Next.js's opengraph-image/apple-icon metadata routes are static-exported
    # without a file extension, so nginx can't infer their Content-Type from
    # mime.types — set it explicitly or social/iOS clients will reject them.
    location = /opengraph-image { default_type image/png; }
    location = /apple-icon { default_type image/png; }
    location ~ ^/(atelier|brutalist|starwars)/opengraph-image$ { default_type image/png; }

    # Not in every distro's default mime.types.
    location = /manifest.webmanifest { default_type application/manifest+json; }

    # The static export's custom themed 404 page.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
